# =============================================================================
# Telco Reliability Lab — full local stack.
#
#   docker compose up -d --build        # system under test + observability
#   docker compose run --rm k6 run /scripts/scenarios/smoke.js
#
# Service groups:
#   - System under test : postgres, redis, api, web
#   - Observability      : otel-collector, prometheus, tempo, loki, grafana
#   - Load               : k6 (run on demand, never starts on its own)
# =============================================================================
name: telco-reliability-lab

services:
  # ---------------------------------------------------------------- system ---
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco
      POSTGRES_DB: telco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telco -d telco"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: local
      API_PORT: "3000"
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      JWT_SECRET: dev-only-secret-change-me
      ENABLE_FAULTS: "true"
      SEED_ON_START: "true"
      SEED_CUSTOMERS: "100"
      OTEL_ENABLED: "${OTEL_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DEPLOYMENT_ENVIRONMENT: local
      LOKI_ENABLED: "${LOKI_ENABLED:-true}"
      LOKI_URL: http://loki:3100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

  # --------------------------------------------------------- observability ---
  otel-collector:
    build:
      context: ./observability/otel-collector
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./observability/otel-collector/otel-collector.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317" # OTLP gRPC
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo query API

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  # ------------------------------------------------------------------ load ---
  k6:
    image: grafana/k6:0.55.0
    profiles: ["load"] # only runs via `docker compose run k6 ...`
    environment:
      BASE_URL: http://api:3000
      K6_WEB_DASHBOARD: "false"
      # Remote-write target for the "k6 Test Run" Grafana dashboard. Enabled per
      # run by also setting K6_OUT=experimental-prometheus-rw (see :prom npm
      # scripts); without K6_OUT, k6 ignores these and runs offline.
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg,max"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    volumes:
      - ./tests/k6:/scripts
    depends_on:
      - api

volumes:
  pgdata:
  tempo-data:
  loki-data:
