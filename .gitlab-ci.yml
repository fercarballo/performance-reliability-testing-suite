# GitLab CI/CD — mirrors the GitHub pipeline so the project is portable across
# both ecosystems. The performance_smoke stage is the blocking quality gate;
# stress/spike/soak/degradation are intentionally manual (see rules below).

stages:
  - validate
  - build
  - test
  - performance_smoke
  - performance_load
  - report

default:
  image: node:22

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .npm/

# ---------------------------------------------------------------- validate ---
lint:
  stage: validate
  script:
    - npm ci
    - npm run lint

# ------------------------------------------------------------------- build ---
build:
  stage: build
  script:
    - npm ci
    - npm run build

# -------------------------------------------------------------------- test ---
unit-tests:
  stage: test
  script:
    - npm ci
    - npm test

# ------------------------------------------------------- performance_smoke ---
# Blocking gate: builds the system under test and runs the k6 smoke test.
performance_smoke:
  stage: performance_smoke
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    OTEL_ENABLED: "false"
    LOKI_ENABLED: "false"
  script:
    - docker compose up -d --build --wait postgres redis api
    - docker compose run --rm k6 run /scripts/scenarios/smoke.js
  after_script:
    - docker compose logs api || true
    - docker compose down -v || true
  artifacts:
    when: always
    paths:
      - tests/k6/reports/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# -------------------------------------------------------- performance_load ---
# Non-blocking, manual: heavier load profile, run on demand or on a schedule.
performance_load:
  stage: performance_load
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker compose up -d --build --wait postgres redis api
    - docker compose run --rm k6 run /scripts/scenarios/load.js
  after_script:
    - docker compose down -v || true
  artifacts:
    when: always
    paths:
      - tests/k6/reports/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# ------------------------------------------------------------------ report ---
# GitLab Secret Detection & SAST (built-in analyzers).
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
