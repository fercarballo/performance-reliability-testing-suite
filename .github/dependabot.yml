version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      otel:
        patterns: ["@opentelemetry/*"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/observability/otel-collector"
    schedule:
      interval: weekly
