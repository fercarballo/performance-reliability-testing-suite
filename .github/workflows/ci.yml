name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check / lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  smoke:
    name: k6 smoke (blocking gate)
    runs-on: ubuntu-latest
    needs: build-test
    env:
      # CI runs the system-under-test only (no heavy observability stack) so the
      # gate stays fast. Tracing/log shipping are exercised locally.
      OTEL_ENABLED: "false"
      LOKI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and start the system under test (waits for healthy)
        run: docker compose up -d --build --wait postgres redis api

      - name: Run k6 smoke test
        run: docker compose run --rm k6 run /scripts/scenarios/smoke.js

      - name: Upload k6 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-reports
          path: tests/k6/reports/
          if-no-files-found: warn

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
